spring:
  application:
    name: hrms-backend
  profiles:
    active: dev
  jpa:
    defer-datasource-initialization: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000    # 30 minutes
    refresh-token-expiration: 604800000 # 7 days
  encryption:
    key: ${ENCRYPTION_KEY}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
