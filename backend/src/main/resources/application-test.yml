spring:
  datasource:
    url: jdbc:h2:mem:hrms_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 1025

jwt:
  secret: test-secret-key-for-testing-purposes-only-min-256-bits-long
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

encryption:
  key: test-encryption-key-32bytes!!

logging:
  level:
    com.hrms: DEBUG
